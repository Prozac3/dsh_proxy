map $http_upgrade $dsh_connection_upgrade { default upgrade; '' close; }
limit_req_zone $binary_remote_addr zone=dsh_login:10m rate=10r/m;
upstream dsh_backend { server 127.0.0.1:3081; keepalive 16; }
upstream dsh_auth { server 127.0.0.1:3082; keepalive 4; }
server {
    listen 0.0.0.0:3000;
    server_name _;
    client_max_body_size 300m;
    location = /_dsh_proxy_auth {
        internal;
        proxy_pass http://dsh_auth/_auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }
    location = /login {
        limit_req zone=dsh_login burst=10 nodelay;
        proxy_pass http://dsh_auth;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Reuse the official whale asset shipped by the active DSH Web build. It is
    # public in Harness and must load before either authentication cookie exists.
    location = /favicon.svg {
        proxy_pass http://dsh_backend;
        proxy_set_header Host $http_host;
    }
    location / {
        auth_request /_dsh_proxy_auth;
        error_page 401 = @dsh_login_redirect;
        proxy_pass http://dsh_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $dsh_connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location @dsh_login_redirect { return 302 /login?next=$request_uri; }
}
